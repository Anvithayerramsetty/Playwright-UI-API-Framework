name: Playwright UI and API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check API TypeScript
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Run UI tests
        run: npx playwright test --config=playwright.config.ts
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

      - name: Run API tests
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.api.config.ts
        env:
          API_CART_EMAIL: ${{ secrets.API_CART_EMAIL }}
          API_CART_PASSWORD: ${{ secrets.API_CART_PASSWORD }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-reports
          path: |
            playwright-report/
            api-report/
          retention-days: 7